plugins {
    id 'com.android.application'
}

android {
    namespace 'com.worldofsimulators.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.worldofsimulators.app'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Android Browser Helper is the official Trusted Web Activity launcher.
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
