name: Android GOVRP - TWA launch crash smoke test
on:
  pull_request:
    paths:
      - 'twa-android/**'
      - 'tools/android-twa-smoke.sh'
      - '.github/workflows/android-twa-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            twa-android/**/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Enable Linux KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare app icon
        run: |
          mkdir -p twa-android/app/src/main/res/drawable
          cp public/icon-512x512.png twa-android/app/src/main/res/drawable/ic_launcher.png
      - name: Compile APK for Android emulator
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p twa-android --no-daemon :app:assembleDebug
      - name: Launch TWA in Android emulator and detect Java crashes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis_playstore
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          emulator-options: -no-snapshot -no-window -no-audio -gpu swiftshader_indirect
          disable-animations: true
          script: bash tools/android-twa-smoke.sh
      - name: Save crash report even if test fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: govrp-android-twa-emulator-logcat
          path: twa-android/app/build/smoke-logs/
          if-no-files-found: warn
          retention-days: 5
