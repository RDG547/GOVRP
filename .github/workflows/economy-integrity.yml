name: Economy integrity checks

on:
  pull_request:
    paths:
      - 'src/features/economy/**'
      - 'src/lib/economy/**'
      - 'src/lib/realtime.js'
      - 'tools/test-economy-live-integrity.mjs'
      - 'tools/test-company-national-market-balance.mjs'
      - 'tools/test-presidential-review-atomic.mjs'
      - 'src/lib/executiveGovernance.js'
      - 'src/components/business/CompanyRankings.jsx'
      - 'src/components/social-x/PostCard.jsx'
      - 'src/components/PhoneAppViewport.jsx'
      - 'src/contexts/AuthContext.jsx'
      - 'src/lib/moderationAccess.js'
      - 'src/lib/sessionRecovery.js'
      - 'tools/test-auth-session-recovery.mjs'
      - 'src/components/bank/CardLimitRequest.jsx'
      - 'src/components/bank/BankManagementPanel.jsx'
      - 'tools/test-card-limit-review-contract.mjs'
      - 'src/components/elections/ElectoralManagement.jsx'
      - 'src/components/parties/**'
      - 'src/lib/parliamentGovernance.js'
      - 'src/pages/services/ParliamentPanel.jsx'
      - 'tools/test-nov17-govrp-enhancements.mjs'
      - 'src/pages/dashboards/panels/PresidentDashboard.jsx'
      - 'supabase/migrations/**'
      - '.github/workflows/economy-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  economy-contracts-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify realtime scopes and financial contracts
        run: |
          node tools/test-economy-live-integrity.mjs
          node tools/test-company-national-market-balance.mjs
          node tools/test-presidential-review-atomic.mjs
          node tools/test-nov17-govrp-enhancements.mjs
          node tools/test-card-limit-review-contract.mjs
          node tools/test-auth-session-recovery.mjs
      - name: Build GOV.RP frontend
        run: npm run build
